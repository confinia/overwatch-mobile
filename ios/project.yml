# Xcode project definition, regenerated by `xcodegen` — same discipline as
# ecobuilding/mobile: the .xcodeproj is a build product, not a source.
name: Overwatch
options:
  bundleIdPrefix: io.confinia
  developmentLanguage: en
  deploymentTarget:
    iOS: "16.0"          # a ham's phone is often not a new phone
  createIntermediateGroups: true

targets:
  Overwatch:
    type: application
    platform: iOS
    sources:
      - path: Overwatch/Sources
      - path: Overwatch/Assets.xcassets
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: "38WRV3R7D5"
        PRODUCT_BUNDLE_IDENTIFIER: io.confinia.overwatch
        # Native IS the product since the 2026-08-28 pivot: it wears the
        # product name and icon. (The amber "Dev" era was for coexisting with
        # a primary PWA.)
        INFOPLIST_KEY_CFBundleDisplayName: "Overwatch"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait

  # Drives the app for store screenshots and the review demo video: taps
  # through station -> pass -> frame, ASSERTING each screen's content before
  # capturing — the guard against ever again shipping a picture of the wrong
  # screen (the Chrome-wizard lesson).
  OverwatchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Overwatch/UITests
    dependencies:
      - target: Overwatch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: "38WRV3R7D5"
        PRODUCT_BUNDLE_IDENTIFIER: io.confinia.overwatch.uitests
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: Overwatch

schemes:
  Overwatch:
    build:
      targets:
        Overwatch: all
        OverwatchUITests: [test]
    test:
      # The test plan turns each UI-test run into a SCREEN RECORDING kept in
      # the result bundle — on a physical device this is the "captured on a
      # physical device" demo video Apple asks for, harvested with
      # xcresulttool, no human hand on the phone (#376 review).
      testPlans:
        - path: Overwatch.xctestplan
          defaultPlan: true
