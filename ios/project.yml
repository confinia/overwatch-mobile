# Xcode project definition, regenerated by `xcodegen` — same discipline as
# ecobuilding/mobile: the .xcodeproj is a build product, not a source.
name: Overwatch
options:
  bundleIdPrefix: io.confinia
  developmentLanguage: en
  deploymentTarget:
    iOS: "16.0"          # a ham's phone is often not a new phone
  createIntermediateGroups: true

targets:
  Overwatch:
    type: application
    platform: iOS
    sources:
      - path: Overwatch/Sources
      - path: Overwatch/Assets.xcassets
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: "38WRV3R7D5"
        PRODUCT_BUNDLE_IDENTIFIER: io.confinia.overwatch
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait

schemes:
  Overwatch:
    build:
      targets:
        Overwatch: all
